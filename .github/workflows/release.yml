name: Create Application Release

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup-old-releases:
    name: Clean Old Releases & Cache
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Clear GitHub Actions Cache
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const caches = await github.rest.actions.getActionsCacheList({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              for (const cache of caches.data.actions_caches) {
                await github.rest.actions.deleteActionsCacheById({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id,
                });
                console.log(`Deleted cache: ${cache.key} (${cache.id})`);
              }
              console.log(`Cleared ${caches.data.actions_caches.length} caches.`);
            } catch (error) {
              console.log(`Cache cleanup skipped: ${error.message}`);
            }

      - name: Delete all existing GitHub Releases
        uses: dev-drprasad/delete-older-releases@v0.3.1
        with:
          keep_latest: 0
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  get-release-info:
    name: Get Release Information
    needs: cleanup-old-releases
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag: v${{ steps.get_version.outputs.version }}
      changelog: ${{ steps.get_changelog.outputs.changelog }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Get version from version.json
        id: get_version
        run: |
          VERSION=$(jq -r '.latest_version' config/version.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get changelog for the version
        id: get_changelog
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          CHANGELOG_BODY=$(jq -r --arg VERSION "$VERSION" '.changelog[$VERSION] | .[] | "- \(.)"' config/version.json)
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG_BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  build-windows:
      name: Build Windows (Main + Lite + Core)
      needs: get-release-info
      runs-on: windows-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v4
  
        - name: Set up Python 3.11
          uses: actions/setup-python@v5
          with:
            python-version: '3.11'
  
        - name: Install dependencies
          run: pip install -r requirements.txt
  
        - name: Create .env file
          run: echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" > .env
          shell: bash
  
        - name: Install Inno Setup
          run: choco install innosetup --yes
          shell: powershell

        - name: Clean old builds
          run: |
            if exist "dist" rmdir /s /q "dist"
            if exist "build" rmdir /s /q "build"
            mkdir dist
          shell: cmd

        - name: Run Windows build script
          run: |
            set APP_VERSION=${{ needs.get-release-info.outputs.version }}
            scripts\build_windows.bat
          shell: cmd

        - name: Create Secure Core Zip (Windows)
          shell: python
          run: |
            import os, shutil, zipfile, compileall

            version = '${{ needs.get-release-info.outputs.version }}'
            zip_name = f'dist/core_win_v{version}.zip'
            temp_dir = 'dist/core_temp_win'

            if os.path.exists(temp_dir): shutil.rmtree(temp_dir)

            def ignore_func(dir, files):
                ignored = [f for f in files if f in ['venv', '.git', '.github', 'dist', 'build', '__pycache__', 'user_uploads', '.env', '.vscode', 'web', 'docs', 'scripts', 'backups']]
                if os.path.basename(dir) == 'assets':
                    if 'screenshots' in files:
                        ignored.append('screenshots')
                return ignored

            shutil.copytree('.', temp_dir, ignore=ignore_func)
            print('Compiling Windows Core (Py3.11)...')
            compileall.compile_dir(temp_dir, force=True, legacy=True)

            with zipfile.ZipFile(zip_name, 'w', zipfile.ZIP_DEFLATED) as zf:
                for root, dirs, files in os.walk(temp_dir):
                    for file in files:
                        if file.endswith('.py'): continue
                        if file.endswith(('.exe', '.bat', '.sh', '.spec', '.ps1', '.iss')): continue
                        full_path = os.path.join(root, file)
                        rel_path = os.path.relpath(full_path, temp_dir)
                        zf.write(full_path, rel_path)

            shutil.rmtree(temp_dir)
            print(f'Success: Created {zip_name}')

        - name: Debug - List installer output directory
          shell: powershell
          run: |
            Write-Host "=== dist/installer/ contents ==="
            if (Test-Path "dist/installer") {
              Get-ChildItem -Path "dist/installer" -Recurse | Select-Object Name, Length, LastWriteTime
            } else {
              Write-Host "[WARNING] dist/installer/ does NOT exist!"
            }
            Write-Host "=== dist/ *.exe files ==="
            Get-ChildItem -Path "dist" -Filter "*.exe" -Recurse | Select-Object Name, Length, FullName
            Write-Host "=== dist/ *.zip files ==="
            Get-ChildItem -Path "dist" -Filter "*.zip" | Select-Object Name, Length

        - name: Verify installer EXE exists
          shell: powershell
          run: |
            $installerDir = "dist\installer"
            if (Test-Path $installerDir) {
              $files = Get-ChildItem -Path $installerDir -Filter "*.exe"
              if ($files.Count -gt 0) {
                Write-Host "✅ Installer EXE found:"
                $files | ForEach-Object { Write-Host "   - $($_.Name) ($($_.Length / 1MB) MB)" }
              } else {
                Write-Host "❌ FATAL ERROR: No .exe files found in dist/installer/"
                Write-Host "Build failed. Installer was not created by Inno Setup."
                exit 1
              }
            } else {
              Write-Host "❌ FATAL ERROR: dist/installer/ directory does NOT exist!"
              Write-Host "Inno Setup did not create the installer directory."
              exit 1
            }

        - name: Create Main App Portable Zip
          shell: powershell
          run: |
            $version = "${{ needs.get-release-info.outputs.version }}"
            $source = "dist\NREGA Bot\*"
            $dest = "dist\NREGABot-v${version}-Portable.zip"
            Compress-Archive -Path $source -DestinationPath $dest -Force
            Write-Host "Created: $dest"

        - name: Upload Windows Artifacts
          uses: actions/upload-artifact@v4
          with:
            name: windows-builds
            path: |
              dist/installer/*.exe
              dist/NREGABot-v*-Portable.zip
              dist/core_win_*.zip
              dist/NREGA Bot Lite.exe
            retention-days: 1

  build-linux:
    name: Build Linux Loader
    needs: get-release-info
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build Main Loader with PyInstaller
        run: |
          pyinstaller --noconfirm --windowed --onefile --name "NREGA Bot" \
          --icon="assets/app_icon.icns" \
          --add-data="assets:assets" \
          --add-data="config:config" \
          --add-data="docs/changelog.json:docs/" \
          --add-data="src:src" \
          --add-data="web:web" \
          --collect-all customtkinter \
          --collect-data fpdf \
          --hidden-import=selenium \
          --hidden-import=webdriver_manager \
          --hidden-import=pandas \
          --hidden-import=PIL \
          --hidden-import=requests \
          --hidden-import=fpdf \
          --hidden-import=babel.numbers \
          --hidden-import=tkcalendar \
          --hidden-import=getmac \
          --hidden-import=packaging \
          --hidden-import=main_app \
          --collect-submodules=src.tabs \
          loader.py

      - name: Create portable archive
        run: |
          cd dist
          tar -czvf NREGABot-v${{ needs.get-release-info.outputs.version }}-Linux.tar.gz "NREGA Bot"
          cd ..

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/NREGABot-v${{ needs.get-release-info.outputs.version }}-Linux.tar.gz
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs: [get-release-info, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Debug - List downloaded artifacts
        run: |
          echo "=== Artifacts structure ==="
          find artifacts/ -type f -exec ls -lh {} \;
          echo ""
          echo "=== All .exe files ==="
          find artifacts/ -name "*.exe" -exec ls -lh {} \;

      - name: Verify Setup.exe exists before release
        run: |
          if find artifacts/ -name "*Setup.exe" -o -name "*Setup*.exe" 2>/dev/null | grep -q .; then
            echo "✅ Setup.exe found in artifacts"
            find artifacts/ -name "*Setup*.exe" -exec ls -lh {} \;
          else
            echo "❌ ERROR: Setup.exe NOT found in artifacts!"
            echo "Available .exe files:"
            find artifacts/ -name "*.exe" -exec ls -lh {} \;
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: NREGA Bot v${{ needs.get-release-info.outputs.version }}
          body: ${{ needs.get-release-info.outputs.changelog }}
          tag_name: v${{ needs.get-release-info.outputs.version }}
          files: |
            artifacts/windows-builds/*.exe
            artifacts/windows-builds/*.zip
            artifacts/linux-build/*