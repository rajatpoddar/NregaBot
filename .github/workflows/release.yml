name: Create Application Release

on:
  push:
    branches:
      - main   # Runs automatically on every push to main
  workflow_dispatch: {} # Allows manual trigger

jobs:
  # --- 1. Get Release Info ---
  get-release-info:
    name: Get Release Information
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag: v${{ steps.get_version.outputs.version }}
      changelog: ${{ steps.get_changelog.outputs.changelog }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Get version from version.json
        id: get_version
        run: |
          VERSION=$(jq -r '.latest_version' config/version.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get changelog for the version
        id: get_changelog
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          CHANGELOG_BODY=$(jq -r --arg VERSION "$VERSION" '.changelog[$VERSION] | .[] | "- \(.)"' config/version.json)
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG_BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  # --- 1b. Validate Locales (fail fast on key drift / broken translations) ---
  validate-locales:
    name: Validate locale parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check missing keys in all locales (en/hi/kn/bn/hinglish)
        run: python scripts/check_missing_keys.py

      - name: Rebuild kn/bn/hinglish from part files (detects translation drift)
        run: python scripts/build_locales.py

      - name: Verify rebuild left no drift in git
        run: git diff --exit-code src/locales/

  # --- 1c. Run unit tests (fail fast on logic regressions) ---
  run-tests:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        # Only the deps needed to import loader.py / lite_loader.py and run
        # the rollback tests (full requirements.txt is installed by the build
        # jobs; keeping this job lean keeps it fast).
        run: pip install pytest requests appdirs customtkinter

      - name: Run pytest
        run: python -m pytest -v

  # --- 2. Build for Windows (Loader EXE + Lite Portable ZIP + Secure Win Core Zip) ---
  build-windows:
      name: Build Windows (Main + Lite + Core)
      needs: [get-release-info, validate-locales]
      runs-on: windows-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v4
  
        - name: Set up Python 3.11
          uses: actions/setup-python@v5
          with:
            python-version: '3.11'
  
        - name: Install dependencies
          run: pip install -r requirements.txt
  
        - name: Install Inno Setup
          run: choco install innosetup --yes
          shell: powershell
  
        - name: Run Windows build script
          run: |
            set APP_VERSION=${{ needs.get-release-info.outputs.version }}
            scripts\build_windows.bat
          shell: cmd
  
        - name: Create Core Zip (Windows)
          shell: python
          run: |
            import os, zipfile
            
            version = '${{ needs.get-release-info.outputs.version }}'
            zip_name = f'dist/core_win_v{version}.zip'
            
            # AUDIT FIX (25 Aug 2026) — WHITELIST packaging, mirroring
            # scripts/build_update.py (the proven macOS core-zip packager).
            # The old blacklist copytree shipped AGENTS.md (internal NAS IP +
            # deploy topology), improvement plans, dev/test scripts, and would
            # have shipped nrega-server secrets whenever that folder existed at
            # build time. Only runtime-needed files ship now — same guarantee
            # the macOS zip already had.
            ALLOWED_TOP_LEVEL = {
                "main_app.py", "lite_app.py", "lite_loader.py", "requirements.txt",
                "src", "config", "assets", "docs",
            }
            ALLOWED_DOCS = {"changelog.json", "license.txt"}
            ALLOWED_EXT = (".py", ".json", ".txt", ".html", ".css", ".js", ".bat", ".sh",
                           ".md", ".png", ".ico", ".icns", ".wav", ".ttf", ".bmp",
                           ".jpeg", ".jpg", ".csv")
            SKIP_DIRS = {"__pycache__", ".git", "venv", "env", ".venv", "dist", "build",
                         "user_uploads", ".idea", ".vscode", "Update_Output", "backups",
                         "screenshots"}
            SENSITIVE_FILES = {".env", ".env.example", ".env.dev", ".env.production",
                               "firebase-service-account.json", "hooks.json",
                               "deploy.sh", "docker-compose.yml", "Dockerfile",
                               ".dockerignore", ".gitignore"}
            
            def _is_allowed(rel_path):
                norm = rel_path.replace("\\", "/")
                first = norm.split("/")[0]
                if first not in ALLOWED_TOP_LEVEL:
                    return False
                if first == "docs":
                    return norm in {f"docs/{f}" for f in ALLOWED_DOCS}
                if "/" not in norm:
                    return norm in ALLOWED_TOP_LEVEL
                if os.path.basename(norm) in SENSITIVE_FILES:
                    return False
                return norm.endswith(ALLOWED_EXT)
            
            if os.path.exists(zip_name):
                os.remove(zip_name)
            
            count = 0
            # IMPORTANT: .py source files ARE included (same as the macOS core
            # zip built by scripts/build_update.py). The deployed loader EXE
            # reads app_live/src/config.py to detect the installed version.
            # A compiled-only zip (all .py stripped, only .pyc shipped) made
            # that read fail on Windows, so the loader treated the install as
            # version 0.0.0 and re-downloaded + re-extracted the core zip on
            # EVERY launch. Shipping the source lets already-installed loaders
            # self-heal through the next smart update without reinstalling.
            with zipfile.ZipFile(zip_name, 'w', zipfile.ZIP_DEFLATED) as zf:
                for top in sorted(ALLOWED_TOP_LEVEL):
                    if not os.path.exists(top):
                        continue
                    if os.path.isfile(top):
                        if _is_allowed(top):
                            zf.write(top, top)
                            count += 1
                        continue
                    for root, dirs, files in os.walk(top):
                        dirs[:] = [d for d in dirs if d not in SKIP_DIRS]
                        for file in files:
                            fp = os.path.join(root, file)
                            arc = os.path.relpath(fp).replace("\\", "/")
                            if _is_allowed(arc):
                                zf.write(fp, arc)
                                count += 1
            print(f'Success: Created {zip_name} ({count} whitelisted files)')

            # Compute the SHA-256 so config/version.json's core_update.hash_windows
            # can be filled in before uploading this zip (enables same-version
            # hotfixes). IMPORTANT: copy this hash into config/version.json ->
            # core_update.hash_windows when deploying this release (build_update.py
            # does this automatically for local builds; CI only prints it).
            import hashlib
            h = hashlib.sha256()
            with open(zip_name, 'rb') as fh:
                for chunk in iter(lambda: fh.read(8192), b''):
                    h.update(chunk)
            digest = h.hexdigest()
            hash_file = f'dist/core_win_v{version}.sha256'
            with open(hash_file, 'w') as fh:
                fh.write(digest)
            print(f'SHA-256 of {zip_name}: {digest}')
            print(f'Wrote {hash_file}')

        - name: Upload Windows Artifacts
          uses: actions/upload-artifact@v4
          with:
            name: windows-builds
            path: |
              dist/installer/*.exe
              dist/core_win_*.zip
              dist/core_win_*.sha256
              dist/NREGA_Bot_Lite_v*_portable.zip
            retention-days: 1

        - name: Debug - List Windows build outputs
          shell: powershell
          run: |
            Write-Host "=== Files in dist/ ===" -ForegroundColor Cyan
            Get-ChildItem -Path "dist" -Recurse -File | ForEach-Object {
              $rel = $_.FullName.Replace((Get-Location).Path + "\", "")
              Write-Host "  $rel ($([math]::Round($_.Length/1KB,2)) KB)" -ForegroundColor Green
            }

  # --- 2b. Build Windows BETA Portable (no auto-update, folder+zip) ---
  build-beta-windows:
    name: Build Windows Beta Portable
    needs: [get-release-info, validate-locales]
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Beta Portable build
        shell: cmd
        run: |
          scripts\build_beta_portable.bat onefile ${{ needs.get-release-info.outputs.version }}-beta

      - name: Upload Beta Portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-beta-portable
          path: dist/NREGA_Bot_Beta_v*_portable.exe
          if-no-files-found: error
          retention-days: 1

  # --- 3. Build for Linux (Portable Loader) ---
  build-linux:
    name: Build Linux Loader
    needs: [get-release-info, validate-locales]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build Main Loader with PyInstaller
        run: |
          pyinstaller --noconfirm --windowed --onefile --name "NREGA Bot" \
          --icon="assets/app_icon.icns" \
          --add-data="assets:assets" \
          --add-data="config:config" \
          --add-data="docs/changelog.json:docs/" \
          --add-data="src:src" \
          --add-data="src/locales:src/locales" \
          --collect-all customtkinter \
          --collect-data fpdf \
          --collect-all selenium \
          --collect-all webdriver_manager \
          --hidden-import=pandas \
          --hidden-import=PIL \
          --hidden-import=requests \
          --hidden-import=fpdf \
          --hidden-import=babel.numbers \
          --hidden-import=tkcalendar \
          --hidden-import=getmac \
          --hidden-import=packaging \
          --hidden-import=main_app \
          --hidden-import=humanize \
          --collect-submodules=src.tabs \
          loader.py

      - name: Create portable archive
        run: |
          cd dist
          tar -czvf NREGABot-v${{ needs.get-release-info.outputs.version }}-Linux.tar.gz "NREGA Bot"
          cd ..

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/NREGABot-v${{ needs.get-release-info.outputs.version }}-Linux.tar.gz
          retention-days: 1

  # --- 4. Publish Release ---
  publish-release:
    name: Publish GitHub Release
    needs: [get-release-info, build-windows, build-beta-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Delete existing release & tag (ensure fresh release)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v${{ needs.get-release-info.outputs.version }}
        run: |
          # Delete release if exists
          gh release delete "$TAG_NAME" --yes 2>/dev/null || echo "No existing release for $TAG_NAME"
          # Delete tag if exists
          git push origin :refs/tags/"$TAG_NAME" 2>/dev/null || echo "No existing tag for $TAG_NAME"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: NREGA Bot v${{ needs.get-release-info.outputs.version }}
          body: ${{ needs.get-release-info.outputs.changelog }}
          tag_name: v${{ needs.get-release-info.outputs.version }}
          files: |
            artifacts/windows-builds/**/*.exe
            artifacts/windows-builds/**/*.zip
            artifacts/windows-builds/**/*.sha256
            artifacts/windows-beta-portable/**/*.exe
            artifacts/linux-build/**/*

      - name: Debug - List downloaded artifacts
        run: |
          echo "=== Downloaded Artifacts ==="
          find artifacts/ -type f -exec ls -lh {} \;